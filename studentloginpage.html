<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Savor &amp; Sage</title>

  <!-- Website tab logo -->
  <link rel="icon" type="image/png" href="Images/logos2.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="auth.css">
  <script src="theme-init.js"></script>
</head>

<body>

  <!-- Top utility buttons -->
  <div class="page-utilities">
    <button class="utility-btn" id="themeToggle" type="button" title="Switch theme" aria-label="Switch theme">
      <i class="fa-solid fa-sun"></i>
    </button>
    <button class="utility-btn" id="directionToggle" type="button" title="Switch text direction" aria-label="Switch LTR and RTL">
      <i class="fa-solid fa-arrow-right-arrow-left"></i>
    </button>
  </div>

  <main class="auth-card">
    <a href="index.html" class="brand" aria-label="Savor and Sage home">
      <div class="brand-icon">
        <img src="Images/logos2.png" alt="Savor &amp; Sage Cooking Studio Logo">
      </div>
      <h1>Savor <span>&amp;</span> Sage</h1>
      <p>COOKING STUDIO</p>
    </a>

    <p class="eyebrow">STUDENT PORTAL</p>
    <h2>Welcome back!</h2>
    <p class="subtitle">Sign in to manage your cooking classes.</p>

    <form id="loginForm" novalidate>
      <label for="studentEmail">Email address</label>
      <div class="input-wrap">
        <i class="fa-solid fa-envelope"></i>
        <input id="studentEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <label for="studentPassword">Password</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input id="studentPassword" type="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>

      <p id="loginMessage" class="form-message" role="status" aria-live="polite"></p>

      <button class="submit-btn" type="submit">
        <i class="fa-solid fa-right-to-bracket"></i>
        Sign In
      </button>
    </form>

    <div class="social-auth-section" aria-label="Social sign-in options">
      <div class="social-auth-divider"><span>Or continue with</span></div>

      <div class="social-auth-grid">
        <button type="button" class="social-auth-btn" data-social-provider="google" aria-label="Continue with Google">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
              <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.25-.96 2.31-2.04 3.02l3.3 2.56c1.92-1.77 3.04-4.38 3.04-7.48 0-.72-.06-1.41-.19-2.08H12z"/>
              <path fill="#34A853" d="M12 22c2.75 0 5.06-.91 6.75-2.46l-3.3-2.56c-.91.61-2.08.98-3.45.98-2.65 0-4.9-1.79-5.7-4.2H2.89v2.64C4.57 19.74 8.01 22 12 22z"/>
              <path fill="#4A90E2" d="M6.3 13.76A5.99 5.99 0 0 1 5.98 12c0-.61.11-1.2.32-1.76V7.6H2.89A9.98 9.98 0 0 0 2 12c0 1.61.39 3.14 1.07 4.4l3.23-2.64z"/>
              <path fill="#FBBC05" d="M12 6.04c1.5 0 2.84.52 3.9 1.53l2.92-2.92C17.05 3.01 14.74 2 12 2 8.01 2 4.57 4.26 2.89 7.6l3.41 2.64c.8-2.41 3.05-4.2 5.7-4.2z"/>
            </svg>
          </span>
          <span>Google</span>
        </button>

        <button type="button" class="social-auth-btn" data-social-provider="apple" aria-label="Continue with Apple">
          <span class="social-icon" aria-hidden="true"><i class="fa-brands fa-apple"></i></span>
          <span>Apple</span>
        </button>
      </div>

      <p class="social-auth-status" id="socialAuthStatus" role="status" aria-live="polite"></p>
    </div>

    <p class="auth-switch">
      New to Savor &amp; Sage?<a href="signuppage.html">Sign up</a>
    </p>
  </main>

  <script src="auth.js"></script>
  <script>
    const loginMessage = document.getElementById("loginMessage");
    const emailInput = document.getElementById("studentEmail");
    const params = new URLSearchParams(window.location.search);

    // Coming from the sign-up page
    if (params.get("registered") === "1") {
      if (params.get("email")) emailInput.value = params.get("email");
      setFormMessage(loginMessage, "Account created! Please sign in.", "success");
      document.getElementById("studentPassword").focus();
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = emailInput.value.trim().toLowerCase();
      const password = document.getElementById("studentPassword").value;

      if (!email || !password) {
        setFormMessage(loginMessage, "Please enter your email and password.");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setFormMessage(loginMessage, "Please enter a valid email address.");
        return;
      }

      const account = findStudentAccount(email);

      if (!account) {
        setFormMessage(loginMessage, "No account found for this email. Please sign up first.");
        return;
      }

      if (account.password !== password) {
        setFormMessage(loginMessage, "Incorrect password. Please try again.");
        return;
      }

      // Demo login only (browser storage, no server).
      localStorage.setItem("studentLoggedIn", "true");
      localStorage.setItem("studentName", account.name);
      localStorage.setItem("studentEmail", account.email);

      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
