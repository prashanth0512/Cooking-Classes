
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Savor & Sage</title>

  <!-- Website tab logo -->
  <link rel="icon" type="image/png" href="Images/logos2.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1C1116;
      --surface: #2A1920;
      --text: #FFF8F5;
      --border: rgba(184, 115, 78, 0.3);
    }

    html[data-theme="light"] {
      --bg: #FFF8F5;
      --surface: #FFFFFF;
      --text: #30212A;
      --border: #E8D8D8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: 'DM Sans', sans-serif;
      background: #1C1116;
      color: #FFF8F5;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 430px;
      padding: 38px;
      border: 1px solid rgba(184,115,78,.3);
      border-radius: 20px;
      background: #2A1920;
      box-shadow: 0 20px 60px #0005;
      animation: loginAppear .6s ease;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    /* Round logo image */
    .brand-icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      display: block;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #B8734E;
      box-shadow: 0 5px 20px #0004;
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand-icon:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px #B8734E40;
    }

    .brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 27px;
      color: #fff;
    }

    .brand h1 span {
      color: #B8734E;
    }

    .brand p {
      margin-top: 7px;
      color: #D0BEC4;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .eyebrow {
      color: #B8734E;
      font-size: 11px;
      letter-spacing: 2px;
      text-align: center;
    }

    h2 {
      margin-top: 9px;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 26px;
    }

    .subtitle {
      margin: 8px 0 25px;
      color: #D0BEC4;
      text-align: center;
      font-size: 13px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 12px;
      color: #F3E6E8;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid rgba(184,115,78,.3);
      border-radius: 9px;
      background: #1C1116;
      color: #FFF8F5;
      outline: none;
      font: inherit;
      transition: border-color .25s, box-shadow .25s;
    }

    input:focus {
      border-color: #B8734E;
      box-shadow: 0 0 0 3px #B8734E20;
    }

    .submit-btn {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #B8734E;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: .25s;
    }

    .submit-btn:hover {
      background: #ca8b67;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px #B8734E30;
    }

    #loginMessage {
      margin-top: 12px;
      color: #F3B5B5;
      font-size: 12px;
      text-align: center;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #D0BEC4;
      text-decoration: none;
      font-size: 12px;
      transition: color .25s;
    }

    .back-link:hover {
      color: #B8734E;
    }

    @keyframes loginAppear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 22px;
      }

      .brand h1 {
        font-size: 24px;
      }
    }
    /* Top Utility Buttons */
.page-utilities {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 10px;
  z-index: 1000;
}

.utility-btn {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(184, 115, 78, 0.3);
  border-radius: 8px;
 
  color: #B8734E;
  cursor: pointer;
  font-size: 15px;
  transition: background 0.2s, color 0.2s;
}

.utility-btn:hover {
  background: #5E2335;
  color: #FFF8F5;
}

/* Light Theme */
body.light-theme {
  background: #FFF8F5;
  color: #30212A;
}



body.light-theme .brand h1 {
  color: #30212A;
}

body.light-theme label {
  color: #493641;
}

body.light-theme input {
  background: #FFF8F5;
  color: #30212A;
  border-color: rgba(94, 35, 53, 0.25);
}

body.light-theme .subtitle,
body.light-theme .back-link {
  color: #6D5961;
}

/* RTL direction */
html[dir="rtl"] .page-utilities {
  right: auto;
  left: 20px;
}

html[dir="rtl"] .login-card {
  direction: rtl;
  text-align: right;
}

html[dir="rtl"] .brand,
html[dir="rtl"] .eyebrow,
html[dir="rtl"] h2,
html[dir="rtl"] .subtitle,
html[dir="rtl"] .back-link,
html[dir="rtl"] #loginMessage {
  text-align: center;
}

@media (max-width: 480px) {
  .page-utilities {
    top: 12px;
    right: 12px;
    gap: 7px;
  }

  html[dir="rtl"] .page-utilities {
    right: auto;
    left: 12px;
  }

  .login-card {
    margin-top: 35px;
  }
}
a.brand {
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
body.light-theme .login-card {
  background: #FFFFFF;
  border-color: rgba(74, 36, 15, 0.35);
}

/* Social Authentication Section */
.social-auth-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0 16px;
  color: #D0BEC4;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.4px;
}

.social-auth-divider::before,
.social-auth-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(184, 115, 78, 0.28);
}

.social-auth-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.social-auth-btn {
  min-height: 48px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 1px solid rgba(184, 115, 78, 0.35);
  border-radius: 10px;
  background: #1C1116;
  color: #FFF8F5;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.22s ease, border-color 0.22s ease, color 0.22s ease, transform 0.22s ease;
}

.social-auth-btn:hover {
  background: rgba(94, 35, 53, 0.55);
  border-color: #E3B89F;
  color: #FFF8F5;
  transform: translateY(-2px);
}

.social-auth-btn:focus-visible {
  outline: 2px solid #B8734E;
  outline-offset: 3px;
}

.social-auth-btn:active {
  transform: translateY(0);
}

.social-auth-btn .social-icon {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 17px;
  line-height: 1;
}

.social-auth-status {
  margin-top: 12px;
  color: #E3B89F;
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
  min-height: 0;
}

body.light-theme .social-auth-divider {
  color: #6D5961;
}

body.light-theme .social-auth-divider::before,
body.light-theme .social-auth-divider::after {
  background: #E8D8D8;
}

body.light-theme .social-auth-btn {
  background: #FFF8F5;
  border-color: rgba(94, 35, 53, 0.25);
  color: #30212A;
}

body.light-theme .social-auth-btn:hover {
  background: #5E2335;
  border-color: #5E2335;
  color: #FFF8F5;
}

body.light-theme .social-auth-status {
  color: #5E2335;
}

@media (max-width: 420px) {
  .social-auth-grid {
    grid-template-columns: 1fr;
  }
}
  </style>
  <link rel="stylesheet" href="shared.css">
  <script src="theme-init.js"></script>
</head>

<body>

  <main class="login-card">
    <div class="page-utilities">

  <!-- Dark / Light -->
  <button class="utility-btn" id="themeToggle"
          type="button" title="Switch theme"
          aria-label="Switch theme">
    <i class="fa-solid fa-sun"></i>
  </button>

  <!-- LTR / RTL -->
  <button class="utility-btn" id="directionToggle"
          type="button" title="Switch text direction"
          aria-label="Switch LTR and RTL">
    <i class="fa-solid fa-arrow-right-arrow-left"></i>
  </button>

    </div>

    <a href="index.html" class="brand" aria-label="Savor and Sage home">
      <div class="brand-icon">
        <img src="Images/logos2.png" alt="Savor & Sage Cooking Studio Logo">
      </div>

      <h1>Savor <span>&amp;</span> Sage</h1>
      <p>COOKING STUDIO</p>
    </a>

    <p class="eyebrow">STUDENT PORTAL</p>
    <h2>Welcome back!</h2>
    <p class="subtitle">Sign in to manage your cooking classes.</p>
    

    <form id="loginForm">
      <label for="studentName">Student name</label>
      <input
        id="studentName"
        type="text"
        placeholder="Enter your name"
        autocomplete="name"
        required
      >

      <label for="studentEmail">Email address</label>
      <input
        id="studentEmail"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="studentPassword">Password</label>
      <input
        id="studentPassword"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <p id="loginMessage" role="status"></p>

      <button class="submit-btn" type="submit">
        <i class="fa-solid fa-right-to-bracket"></i>
        Sign In
      </button>
    </form>

    <div class="social-auth-section" aria-label="Social sign-in options">
      <div class="social-auth-divider"><span>Or continue with</span></div>

      <div class="social-auth-grid">
        <button type="button" class="social-auth-btn" data-social-provider="google" aria-label="Continue with Google">
          <span class="social-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
              <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.25-.96 2.31-2.04 3.02l3.3 2.56c1.92-1.77 3.04-4.38 3.04-7.48 0-.72-.06-1.41-.19-2.08H12z"/>
              <path fill="#34A853" d="M12 22c2.75 0 5.06-.91 6.75-2.46l-3.3-2.56c-.91.61-2.08.98-3.45.98-2.65 0-4.9-1.79-5.7-4.2H2.89v2.64C4.57 19.74 8.01 22 12 22z"/>
              <path fill="#4A90E2" d="M6.3 13.76A5.99 5.99 0 0 1 5.98 12c0-.61.11-1.2.32-1.76V7.6H2.89A9.98 9.98 0 0 0 2 12c0 1.61.39 3.14 1.07 4.4l3.23-2.64z"/>
              <path fill="#FBBC05" d="M12 6.04c1.5 0 2.84.52 3.9 1.53l2.92-2.92C17.05 3.01 14.74 2 12 2 8.01 2 4.57 4.26 2.89 7.6l3.41 2.64c.8-2.41 3.05-4.2 5.7-4.2z"/>
            </svg>
          </span>
          <span>Google</span>
        </button>

        <button type="button" class="social-auth-btn" data-social-provider="apple" aria-label="Continue with Apple">
          <span class="social-icon" aria-hidden="true">
            <i class="fa-brands fa-apple"></i>
          </span>
          <span>Apple</span>
        </button>
      </div>

      <p class="social-auth-status" id="socialAuthStatus" role="status" aria-live="polite"></p>
    </div>



  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("studentName").value.trim();
      const email = document.getElementById("studentEmail").value.trim();
      const password = document.getElementById("studentPassword").value;
      const message = document.getElementById("loginMessage");

      if (!name || !email || !password) {
        message.textContent = "Please fill in all fields.";
        return;
      }

      // Demo login only; password is not verified by a server.
      localStorage.setItem("studentLoggedIn", "true");
      localStorage.setItem("studentName", name);
      localStorage.setItem("studentEmail", email);

      window.location.href = "dashboard.html";
    });

    // Social login configuration check (does not fake authentication)
    const SAVOR_SAGE_AUTH_CONFIG = window.SAVOR_SAGE_AUTH_CONFIG || {
      googleAuthEndpoint: "",
      googleClientId: "",
      appleAuthEndpoint: "",
      appleClientId: ""
    };

    const socialStatus = document.getElementById("socialAuthStatus");
    document.querySelectorAll(".social-auth-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const provider = button.dataset.socialProvider;

        if (
          provider === "google" &&
          SAVOR_SAGE_AUTH_CONFIG.googleAuthEndpoint &&
          SAVOR_SAGE_AUTH_CONFIG.googleClientId
        ) {
          const params = new URLSearchParams({
            client_id: SAVOR_SAGE_AUTH_CONFIG.googleClientId,
            redirect_uri: window.location.origin + "/dashboard.html",
            response_type: "code",
            scope: "openid email profile"
          });
          window.location.href = `${SAVOR_SAGE_AUTH_CONFIG.googleAuthEndpoint}?${params.toString()}`;
          return;
        }

        if (
          provider === "apple" &&
          SAVOR_SAGE_AUTH_CONFIG.appleAuthEndpoint &&
          SAVOR_SAGE_AUTH_CONFIG.appleClientId
        ) {
          const params = new URLSearchParams({
            client_id: SAVOR_SAGE_AUTH_CONFIG.appleClientId,
            redirect_uri: window.location.origin + "/dashboard.html",
            response_type: "code",
            scope: "name email",
            response_mode: "form_post"
          });
          window.location.href = `${SAVOR_SAGE_AUTH_CONFIG.appleAuthEndpoint}?${params.toString()}`;
          return;
        }

        if (socialStatus) {
          socialStatus.textContent =
            provider === "google"
              ? "Google Sign-In is not configured yet. Configure Google OAuth 2.0 (googleClientId & googleAuthEndpoint) and a backend callback to enable it."
              : "Apple Sign-In is not configured yet. Configure Apple Services ID (appleClientId, Team/Key IDs & appleAuthEndpoint) and a backend callback to enable it.";
        }
      });
    });
    // Dark / Light theme toggle
const themeToggle = document.getElementById("themeToggle");

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.body.classList.toggle("light-theme", theme === "light");

  themeToggle.innerHTML = theme === "light"
    ? '<i class="fa-solid fa-moon"></i>'
    : '<i class="fa-solid fa-sun"></i>';

  themeToggle.title = theme === "light"
    ? "Switch to dark theme"
    : "Switch to light theme";

  localStorage.setItem("culinary-theme", theme);
}

applyTheme(localStorage.getItem("culinary-theme") || "dark");

themeToggle.addEventListener("click", () => {
  const isLight = document.body.classList.contains("light-theme");
  applyTheme(isLight ? "dark" : "light");
});


// LTR / RTL direction toggle
const directionToggle = document.getElementById("directionToggle");

function applyDirection(direction) {
  document.documentElement.dir = direction;

  directionToggle.title = direction === "ltr"
    ? "Switch to RTL"
    : "Switch to LTR";

  localStorage.setItem("culinary-direction", direction);
}

applyDirection(
  localStorage.getItem("culinary-direction") || "ltr"
);

directionToggle.addEventListener("click", () => {
  const currentDirection = document.documentElement.dir || "ltr";
  applyDirection(currentDirection === "ltr" ? "rtl" : "ltr");
});
  </script>
</body>
</html>
